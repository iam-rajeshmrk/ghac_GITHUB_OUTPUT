# Demonstrates passing step outputs from one job to another.
name: github output workflow demo

# Allows the workflow to be started manually.
on:
  workflow_dispatch:

# Defines the workflow jobs.
jobs:
  job1:
    # Runs the job on an Ubuntu runner.
    runs-on: ubuntu-latest
    # Makes the step values available to dependent jobs.
    outputs:
      # Exposes the output created by step1.
      output1: ${{ steps.step1.outputs.test_output}}
      # Exposes the output created by step2.
      output2: ${{ steps.step2.outputs.another_output}}
    steps:
      # Creates the first step output.
      - name: Set Output
        id: step1
        run: |
          echo "test_output=hello world" >> $GITHUB_OUTPUT" 
          # Appends the value to GitHub Actions' output file.

      # Creates the second step output.
      - name: Set another output
        id: step2
        run: | 
          echo "another_output=value2" >> $GITHUB_OUTPUT

  job2:
    # Runs the job on an Ubuntu runner.
    runs-on: ubuntu-latest
    # Waits for job1 and makes its outputs available.
    needs: job1
    steps:
      # Prints the outputs received from job1.
      - name: use Outputs from job1
        run: |
         echo: "Output1: ${{needs.job1.outputs.output1}}"
         echo: "Output2: ${{needs.job1.outputs.output2}}"


